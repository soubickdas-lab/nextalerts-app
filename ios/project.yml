# The Xcode project is generated from this file (brew install xcodegen && xcodegen generate),
# so there is no .xcodeproj to merge by hand.
name: NextAlerts
options:
  bundleIdPrefix: in.nextalerts
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  NextAlerts:
    type: application
    platform: iOS
    sources: [NextAlerts]
    info:
      path: NextAlerts/Info.plist
      properties:
        CFBundleDisplayName: NextAlerts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: AI Voice can record your voice when you press the microphone button.
        NSCameraUsageDescription: Lets you take a photo to attach to a chat message or a note.
        NSPhotoLibraryAddUsageDescription: Lets you save a downloaded picture to your photos.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.nextalerts.work
        PRODUCT_NAME: NextAlerts
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

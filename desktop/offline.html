<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextAlerts</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5fa; color: #121430; }
  .box { text-align: center; padding: 24px; max-width: 360px; }
  .logo { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 18px; background: linear-gradient(180deg, #2cc4b4, #0e9488); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 30px; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p { margin: 0 0 20px; color: #6a6f92; }
  button { border: 0; border-radius: 11px; background: #0e9488; color: #fff; font: inherit; font-weight: 600; padding: 10px 22px; cursor: pointer; }
  button:hover { background: #0a6e66; }
  small { display: block; margin-top: 16px; color: #8d90b0; }
  @media (prefers-color-scheme: dark) { body { background: #0b0c1a; color: #eceeff; } p { color: #9194bb; } }
</style>
</head>
<body>
<div class="box">
  <div class="logo" style="width:auto;padding:0 16px;font-size:20px;letter-spacing:-.02em">NextAlerts</div>
  <h1>Can't reach NextAlerts</h1>
  <p>Check the internet connection. The app tries again by itself every few seconds.</p>
  <button id="retry">Try again</button>
  <small id="s"></small>
</div>
<script>
  const go = () => window.nextalertsApp && window.nextalertsApp.retry();
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
  let n = 8;
  const s = document.getElementById('s');
  setInterval(() => { n--; if (n <= 0) { n = 8; go(); } s.textContent = 'Trying again in ' + n + 's'; }, 1000);
</script>
</body>
</html>
